@switch (element) {
  @case ('p') {
    <p [class]="textClass"><ng-content /></p>
  }
  @case ('span') {
    <span [class]="textClass"><ng-content /></span>
  }
  @case ('div') {
    <div [class]="textClass"><ng-content /></div>
  }
  @case ('code') {
    <code [class]="textClass"><ng-content /></code>
  }
}

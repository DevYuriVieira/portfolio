<ng-template #buttonContent>
  <ng-content></ng-content>
</ng-template>

@if (href) {
  <a
    [href]="href"
    [attr.target]="target || null"
    [attr.rel]="rel || null"
    [attr.aria-label]="ariaLabel || null"
    [class]="'button button--' + variant"
  >
    <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
  </a>
} @else {
  <button
    [type]="type"
    [disabled]="disabled"
    [attr.aria-label]="ariaLabel || null"
    [class]="'button button--' + variant"
  >
    <ng-container *ngTemplateOutlet="buttonContent"></ng-container>
  </button>
}

<ng-template #headingContent>
  <ng-content></ng-content>
</ng-template>

@switch (level) {
  @case ('h1') {
    <h1 [class]="headingClass"><ng-container *ngTemplateOutlet="headingContent"></ng-container></h1>
  }
  @case ('h2') {
    <h2 [class]="headingClass"><ng-container *ngTemplateOutlet="headingContent"></ng-container></h2>
  }
  @case ('h3') {
    <h3 [class]="headingClass"><ng-container *ngTemplateOutlet="headingContent"></ng-container></h3>
  }
  @case ('h4') {
    <h4 [class]="headingClass"><ng-container *ngTemplateOutlet="headingContent"></ng-container></h4>
  }
  @case ('h5') {
    <h5 [class]="headingClass"><ng-container *ngTemplateOutlet="headingContent"></ng-container></h5>
  }
  @case ('h6') {
    <h6 [class]="headingClass"><ng-container *ngTemplateOutlet="headingContent"></ng-container></h6>
  }
}

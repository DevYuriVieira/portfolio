<app-section spacing="none" ariaLabel="Hero">
  <app-container size="xl">
    <div class="hero">
      <div class="hero__content">
        <!-- Eyebrow -->
        <app-text
          variant="caption"
          element="span"
          class="hero__eyebrow hero__animate hero__animate--1"
        >
          Engenheiro de Software Júnior | Full Stack Developer
        </app-text>

        <!-- Name -->
        <app-heading
          level="h1"
          size="display"
          class="hero__name hero__animate hero__animate--2"
        >
          Yuri Vieira
        </app-heading>

        <!-- Description -->
        <app-text
          variant="lead"
          class="hero__description hero__animate hero__animate--3"
        >
          Desenvolvo aplicações web modernas com foco em arquitetura limpa,
          performance, boas práticas de engenharia e experiências digitais de qualidade.
        </app-text>

        <!-- Actions -->
        <div class="hero__actions hero__animate hero__animate--4">
          <app-button variant="primary" ariaLabel="Ver projetos">
            Ver projetos
          </app-button>
          <app-link
            href="https://github.com/DevYuriVieira"
            [external]="true"
            ariaLabel="Perfil do GitHub"
          >
            GitHub
          </app-link>
        </div>
      </div>

      <!-- Scroll Indicator -->
      <app-scroll-indicator class="hero__scroll hero__animate hero__animate--5" />
    </div>
  </app-container>
</app-section>

<ng-template #linkContent>
  <ng-content></ng-content>
</ng-template>

@if (external) {
  <a
    [href]="href"
    [target]="isMailto ? '_self' : '_blank'"
    [attr.rel]="isMailto ? null : 'noopener noreferrer'"
    class="link"
    [attr.aria-label]="ariaLabel || null"
  >
    <ng-container *ngTemplateOutlet="linkContent"></ng-container>
  </a>
} @else {
  <a
    [routerLink]="href"
    class="link"
    [attr.aria-label]="ariaLabel || null"
  >
    <ng-container *ngTemplateOutlet="linkContent"></ng-container>
  </a>
}

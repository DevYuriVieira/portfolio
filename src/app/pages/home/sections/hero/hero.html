<app-section spacing="none" ariaLabel="Hero">
  <app-container size="xl">
    <div class="hero">
      <div class="hero__content">
        <!-- Eyebrow -->
        <app-text
          variant="caption"
          element="span"
          class="hero__eyebrow"
        >
          {{ data.eyebrow }}
        </app-text>

        <!-- Name -->
        <app-heading
          level="h1"
          size="display"
          class="hero__name"
        >
          {{ data.name }}
        </app-heading>

        <!-- Description -->
        <app-text
          variant="lead"
          class="hero__description"
        >
          {{ data.description }}
        </app-text>

        <!-- Actions -->
        <div class="hero__actions">
          <app-button variant="primary" ariaLabel="Ver projetos">
            {{ data.projectsCtaText }}
          </app-button>
          <app-link
            [href]="data.githubUrl"
            [external]="true"
            ariaLabel="Perfil do GitHub"
          >
            {{ data.githubCtaText }}
          </app-link>
        </div>
      </div>

      <!-- Scroll Indicator -->
      <app-scroll-indicator class="hero__scroll" />
    </div>
  </app-container>
</app-section>

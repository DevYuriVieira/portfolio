<header class="header">
  <app-container size="xl">
    <div class="header__inner">
      <!-- Brand Logo -->
      <a href="#top" class="header__brand" aria-label="Yuri Vieira - Ir para o início da página" (click)="closeMobileMenu()">
        <span class="header__brand-name">Yuri</span>
      </a>

      <!-- Desktop Navigation -->
      <nav class="header__nav" aria-label="Navegação principal">
        <ul class="header__nav-list">
          <li><a href="#about" class="header__nav-link">Sobre</a></li>
          <li><a href="#experience" class="header__nav-link">Experiência</a></li>
          <li><a href="#skills" class="header__nav-link">Habilidades</a></li>
          <li><a href="#projects" class="header__nav-link">Projetos</a></li>
          <li><a href="#ai-experience" class="header__nav-link">IA & Automação</a></li>
          <li><a href="#contact" class="header__nav-link">Contato</a></li>
        </ul>
      </nav>

      <!-- Header Actions -->
      <div class="header__actions">
        <!-- Structural language indicator placeholder for future i18n -->
        <span class="header__lang-indicator" title="Idioma: Português (Brasil)">PT</span>

        <!-- Mobile Menu Toggle Button -->
        <button
          type="button"
          class="header__menu-btn"
          [attr.aria-expanded]="mobileMenuOpen()"
          aria-haspopup="dialog"
          aria-controls="mobile-menu"
          aria-label="Alternar menu de navegação"
          (click)="toggleMobileMenu()"
        >
          <svg
            class="header__menu-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            @if (mobileMenuOpen()) {
              <path d="M18 6L6 18M6 6l12 12" />
            } @else {
              <path d="M4 8h16M4 16h16" />
            }
          </svg>
        </button>
      </div>
    </div>
  </app-container>

  <!-- Mobile Navigation Drawer Overlay -->
  @if (mobileMenuOpen()) {
    <div
      id="mobile-menu"
      class="header__mobile-overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Menu de navegação mobile"
    >
      <nav class="header__mobile-nav">
        <ul class="header__mobile-list">
          <li>
            <a href="#about" class="header__mobile-link" (click)="closeMobileMenu()">
              Sobre
            </a>
          </li>
          <li>
            <a href="#experience" class="header__mobile-link" (click)="closeMobileMenu()">
              Experiência
            </a>
          </li>
          <li>
            <a href="#skills" class="header__mobile-link" (click)="closeMobileMenu()">
              Habilidades
            </a>
          </li>
          <li>
            <a href="#projects" class="header__mobile-link" (click)="closeMobileMenu()">
              Projetos
            </a>
          </li>
          <li>
            <a href="#ai-experience" class="header__mobile-link" (click)="closeMobileMenu()">
              IA & Automação
            </a>
          </li>
          <li>
            <a href="#contact" class="header__mobile-link" (click)="closeMobileMenu()">
              Contato
            </a>
          </li>
        </ul>
      </nav>
    </div>
  }
</header>
